syntax = "proto3";
import "google/protobuf/empty.proto";
option go_package  = "/proto";
package api_owlmq;

// This file holds the description that plugins need to implement in order to be able to be executed by owlmq


service PluginService {
  rpc Connect(ConnectRequest) returns (ConnectResponse);
  rpc HealthCheck(google.protobuf.Empty) returns (stream google.protobuf.Empty);
}

// Connect is called by a program/user that wants to connect the Plugin with the database system
enum ConnectionStatus {
  ACCEPTED = 0;
  DENIED = 1;
}
message ConnectRequest {
  string plugin_name = 1;
  string connect_to_host = 2;
  string connect_to_password = 3;
}
message ConnectResponse {
  ConnectionStatus status = 1;
}
