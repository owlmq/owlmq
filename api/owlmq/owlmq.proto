  rpc Get(KV_GetRequest) returns (KV_GetResponse);
  rpc Put(KV_PutRequest) returns (KV_PutResponse);
}

//##################
//###   cluster  ###
//##################

message FindSuccessorRequest {
  string address = 1;
}

message FindSuccessorResponse {
  string address = 1;
}

//##############################
//###    key-value store     ###
//##############################
enum KV_STATUS {
  SUCCESS = 0;
  FAILURE = 1;
}

message KV_GetRequest {
  string key = 1;
}

message KV_GetResponse {
  KV_STATUS status = 1;
  string value = 2;
  string error = 3;
}

message KV_PutRequest {
  string key = 1;
  string value = 2;
}

message KV_PutResponse {
  KV_STATUS status = 1;
  string error = 2;
}
